[project]
name = "mojo-sb3-contrib"
version = "0.1.0"
description = "The compute-bound kernels of sb3-contrib, in Mojo"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["numpy"]

[project.optional-dependencies]
# Needed only for the parity tests and the benchmark.
parity = ["sb3-contrib>=2.9.0", "gymnasium", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
